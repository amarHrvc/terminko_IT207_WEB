<!-- Layout wrapper -->
<div class="layout-wrapper layout-navbar-full layout-horizontal layout-without-menu">
    <div class="layout-container">

        <div class="row">
            {{dashboard_menu}}
        </div>

        <!-- Layout container -->
        <div class="layout-page" style="margin-top: 100px !important;">
            <!-- Content wrapper -->
            <div class="content-wrapper">


                <!-- Content -->
                <div class="container-xxl flex-grow-1 container-p-y">

                    <!--   Usluge & bookings Start-->
                    <div class="row mb-6 g-6">

                        <div class="col-12 col-xl-12">

                            <!-- INFO:START -->
                            <div class="col-xl">
                                <div class="card terminko-back-image">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h5 class="mb-0">Informacije o Vasem poslu</h5>
                                        <small class="text-body-secondary float-end">---</small>
                                    </div>
                                    <div class="card-body">
                                        <form method="POST" enctype="multipart/form-data" id="registerTenantForm" action="" method="POST"
                                            onsubmit="createTenant(event)">
                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-fullname">Naziv</label>
                                                <div class="input-group input-group-merge">
                                                    <span id="basic-icon-default-fullname2" class="input-group-text"><i
                                                            class="icon-base ti tabler-building"></i></span>
                                                    <input type="text" class="form-control" 
                                                        id="tenantName" 
                                                        name="tenantName" 
                                                        placeholder="Naziv..." />
                                                </div>
                                            </div>

                                            
    
                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-fullname">Grad</label>
                                                <div class="input-group input-group-merge">
                                                    <span id="basic-icon-default-fullname2" class="input-group-text"><i
                                                            class="icon-base ti tabler-building"></i></span>
                                                    <input type="text" class="form-control" 
                                                        id="tenantCity" 
                                                        name="tenantCity" 
                                                        value="Sarajevo"
                                                        placeholder="Naziv..." />
                                                </div>
                                            </div>     
    
                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-fullname">Adresa</label>
                                                <div class="input-group input-group-merge">
                                                    <span id="basic-icon-default-fullname2" class="input-group-text"><i
                                                            class="icon-base ti tabler-building"></i></span>
                                                    <input type="text" class="form-control" 
                                                        id="tenantAddress" 
                                                        name="tenantAddress"
                                                        value="Ulica 1"
                                                        placeholder="Naziv..." />
                                                </div>
                                            </div>   
    
                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-fullname">Zip code</label>
                                                <div class="input-group input-group-merge">
                                                    <span id="basic-icon-default-fullname2" class="input-group-text"><i
                                                            class="icon-base ti tabler-building"></i></span>
                                                    <input type="text" class="form-control" 
                                                        id="tenantPostalCode" 
                                                        name="tenantPostalCode"
                                                        value="71000"
                                                        placeholder="Naziv..." />
                                                </div>
                                            </div>
                                            


                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-email">Email</label>
                                                <div class="input-group input-group-merge">
                                                    <span class="input-group-text"><i
                                                            class="icon-base ti tabler-mail"></i></span>
                                                    <input type="text" id="tenantEmail" name="tenantEmail"
                                                        class="form-control" placeholder="john.doe"
                                                        aria-label="john.doe"
                                                        aria-describedby="basic-icon-default-email2" value="email@test.com" />
                                                    <span id="basic-icon-default-email2"
                                                        class="input-group-text">@example.com</span>
                                                </div>
                                                <div class="form-text">You can use letters, numbers & periods</div>
                                            </div>


                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-phone">Phone
                                                    No</label>
                                                <div class="input-group input-group-merge">
                                                    <span id="tenantPhonelabel" class="input-group-text"><i
                                                            class="icon-base ti tabler-phone"></i></span>
                                                    <input type="text" id="tenantPhone" name="tenantPhone"
                                                        class="form-control phone-mask" placeholder="658 799 8941"
                                                        value="658 799 8941"
                                                        />
                                                </div>
                                            </div>

<!--                                             
                                            <div class="mb-6">
                                                <label class="form-label" for="basic-icon-default-message">Logo</label>
                                                <br>
                                                <input type="file" name="logo" id="logo">

                                            </div> -->


                                            <button type="submit" class="btn btn-primary">Send</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <!--/  INFO:END  -->

                        </div>
                    </div>
                    <!--  Usluge & bookings  End-->



                    <!-- Footer -->
                    <footer class="content-footer footer bg-footer-theme">
                        <div class="container-xxl">

                        </div>
                    </footer>
                    <!-- / Footer -->

                    <div class="content-backdrop fade"></div>
                </div>
                <!--/ Content wrapper -->
            </div>

            <!--/ Layout container -->
        </div>
    </div>

<script>
    createTenant = (event) => {
        // console.log("🚀 ~ event:", event)
        event.preventDefault();
        
        TenantService.createTenant(event);

        
        
    };
</script>
